<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fare — demo deck</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app talk">
      <section class="slide" id="slide">
        <header class="slide-top">
          <span class="brand">Fare</span>
          <span class="kicker" id="kicker"></span>
          <span class="count" id="count"></span>
        </header>
        <p class="badge" id="badge" hidden></p>
        <h1 id="title"></h1>
        <p class="say" id="say"></p>
        <ul class="points" id="points"></ul>
        <div class="run-box" id="runBox" hidden>
          <span class="run-label">script</span>
          <code id="runCmd"></code>
          <button type="button" class="run-btn" id="runBtn">Run</button>
        </div>
        <p class="hint" id="hint"></p>
      </section>
      <section class="term-pane">
        <div class="term-window">
          <header class="term-top">
            <span class="dots" aria-hidden="true"></span>
            <span class="term-title">zsh — 80×24</span>
            <span class="term-state" id="termState">idle</span>
          </header>
          <pre class="term" id="term"></pre>
        </div>
        <div class="links" id="links"></div>
      </section>
    </div>
    <footer class="bar">
      <span>Enter run</span>
      <span>Space next</span>
      <span>← → skip</span>
      <span>R rerun</span>
      <span>F fullscreen</span>
    </footer>
    <script src="/app.js"></script>
  </body>
</html>
